<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Weather-Advisory Support Bot</title>
<style>
  :root {
    --bg: #0b1220;
    --panel: #131b2e;
    --panel-2: #1a2440;
    --border: #263353;
    --text: #e6ebf5;
    --muted: #8b98b8;
    --accent: #38bdf8;
    --accent-2: #818cf8;
    --user-bubble: linear-gradient(135deg, #38bdf8, #6366f1);
    --bot-bubble: #1e293b;
  }
  * { box-sizing: border-box; }
  body {
    font-family: "Segoe UI", -apple-system, sans-serif;
    max-width: 760px;
    margin: 32px auto;
    background: var(--bg);
    color: var(--text);
    padding: 0 16px;
  }
  header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 20px;
  }
  header .icon {
    font-size: 32px;
    background: var(--panel-2);
    border-radius: 14px;
    width: 52px;
    height: 52px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 1px solid var(--border);
  }
  header h1 {
    font-size: 22px;
    margin: 0;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  header p {
    margin: 2px 0 0;
    font-size: 13px;
    color: var(--muted);
  }
  #chat {
    border: 1px solid var(--border);
    border-radius: 16px;
    height: 480px;
    overflow-y: auto;
    padding: 20px;
    background: var(--panel);
    margin-bottom: 14px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  #chat:empty::before {
    content: "Ask something like \"Is it safe to cycle in Bengaluru today?\"";
    color: var(--muted);
    font-size: 14px;
    font-style: italic;
    margin: auto;
  }
  .bubble-row { display: flex; }
  .bubble-row.user { justify-content: flex-end; }
  .bubble-row.bot { justify-content: flex-start; }
  .bubble {
    max-width: 78%;
    padding: 11px 15px;
    border-radius: 16px;
    line-height: 1.5;
    font-size: 14.5px;
    white-space: pre-wrap;
    overflow-wrap: break-word;
    word-break: break-word;
  }
  /* .bubble {
    max-width: 78%;
    padding: 11px 15px;
    border-radius: 16px;
    line-height: 1.5;
    font-size: 14.5px;
    white-space: pre-wrap;
  } */
  
  .bubble.user {
    background: var(--user-bubble);
    color: #fff;
    border-bottom-right-radius: 4px;
  }
  .bubble.bot {
    background: var(--bot-bubble);
    border: 1px solid var(--border);
    color: var(--text);
    border-bottom-left-radius: 4px;
  }
  .meta-tag {
    display: inline-block;
    margin-top: 8px;
    font-size: 11px;
    color: var(--muted);
    background: rgba(56, 189, 248, 0.08);
    border: 1px solid var(--border);
    padding: 3px 9px;
    border-radius: 999px;
  }
  .row { display: flex; gap: 10px; }
  input {
    flex: 1;
    padding: 13px 16px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--panel-2);
    color: var(--text);
    font-size: 14.5px;
    outline: none;
    transition: border-color 0.15s;
  }
  input:focus { border-color: var(--accent); }
  button {
    padding: 0 22px;
    border-radius: 12px;
    border: none;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: #0b1220;
    font-weight: 700;
    cursor: pointer;
    font-size: 14.5px;
    transition: opacity 0.15s;
  }
  button:disabled { opacity: 0.5; cursor: default; }
  .typing {
    display: flex;
    gap: 4px;
    align-items: center;
    padding: 4px 0;
  }
  .typing span {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--muted);
    animation: blink 1.2s infinite ease-in-out;
  }
  .typing span:nth-child(2) { animation-delay: 0.2s; }
  .typing span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: 0.2; } 40% { opacity: 1; } }
  #chat::-webkit-scrollbar { width: 8px; }
  #chat::-webkit-scrollbar-thumb { background: var(--border); border-radius: 8px; }
</style>
</head>
<body>
  <header>
    <div class="icon">🌦️</div>
    <div>
      <h1>Weather-Advisory Support Bot</h1>
      <p>Live weather · policy-grounded advice</p>
    </div>
  </header>

  <div id="chat"></div>
  <div class="row">
    <input id="input" type="text" placeholder="e.g. Is it safe to cycle in Bengaluru today?" autocomplete="off" />
    <button id="send">Send</button>
  </div>

<script>
let sessionId = null;

async function init() {
  const res = await fetch("/new_session");
  const data = await res.json();
  sessionId = data.session_id;
}

function scrollToBottom() {
  const chat = document.getElementById("chat");
  chat.scrollTop = chat.scrollHeight;
}

function addBubble(text, who, metaText) {
  const chat = document.getElementById("chat");
  const row = document.createElement("div");
  row.className = "bubble-row " + who;

  const wrap = document.createElement("div");
  const bubble = document.createElement("div");
  bubble.className = "bubble " + who;
  bubble.textContent = text;
  wrap.appendChild(bubble);

  if (metaText) {
    const meta = document.createElement("div");
    meta.className = "meta-tag";
    meta.textContent = metaText;
    wrap.appendChild(meta);
  }

  row.appendChild(wrap);
  chat.appendChild(row);
  scrollToBottom();
  return row;
}

function addTypingIndicator() {
  const chat = document.getElementById("chat");
  const row = document.createElement("div");
  row.className = "bubble-row bot";
  row.id = "typing-row";
  row.innerHTML = `
    <div class="bubble bot">
      <div class="typing"><span></span><span></span><span></span></div>
    </div>`;
  chat.appendChild(row);
  scrollToBottom();
}

function removeTypingIndicator() {
  const el = document.getElementById("typing-row");
  if (el) el.remove();
}

async function sendMessage() {
  const input = document.getElementById("input");
  const button = document.getElementById("send");
  const text = input.value.trim();
  if (!text || !sessionId) return;

  addBubble(text, "user");
  input.value = "";
  button.disabled = true;
  addTypingIndicator();

  try {
    const res = await fetch("/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ session_id: sessionId, message: text }),
    });
    const data = await res.json();
    const meta = data.meta || {};
    const metaText = "Policy: " + (meta.matched_sop_id || "none") +
                      (meta.severity ? " · " + meta.severity : "");
    removeTypingIndicator();
    addBubble(data.reply, "bot", metaText);
  } catch (err) {
    removeTypingIndicator();
    addBubble("Something went wrong reaching the server: " + err, "bot");
  } finally {
    button.disabled = false;
    input.focus();
  }
}

document.getElementById("send").addEventListener("click", sendMessage);
document.getElementById("input").addEventListener("keydown", (e) => {
  if (e.key === "Enter") sendMessage();
});

init();
</script>
</body>
</html>
